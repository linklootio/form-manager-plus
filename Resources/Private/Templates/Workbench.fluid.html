<f:section name="Content">
<f:asset.css identifier="fmp-pro" href="EXT:form_manager_plus/Resources/Public/Css/pro.css" />

<f:if condition="{pro}"><f:asset.css identifier="fmp-import-wizard" href="EXT:form_manager_plus_pro/Resources/Public/Css/import-wizard.css" /></f:if>

 <header><h1>{formName}</h1><p data-intro></p></header>
